<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración del Sistema - El Gran Sazón</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .section-card {
            margin-bottom: 2rem;
            box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,0.075);
        }
        .section-header {
            background-color: #f8f9fa;
            padding: 1rem;
            border-bottom: 2px solid #dee2e6;
        }
        .form-label {
            font-weight: 600;
        }
        .day-checkbox {
            margin-right: 1rem;
        }
        .business-hours-table td {
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Include sidebar if you have one -->
            <main class="col-md-12 ms-sm-auto col-lg-12 px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">
                        <i class="fas fa-cog"></i> Configuración del Sistema
                    </h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <a th:href="@{/admin/dashboard}" class="btn btn-sm btn-outline-secondary">
                            <i class="fas fa-arrow-left"></i> Volver al Dashboard
                        </a>
                    </div>
                </div>

                <!-- Success/Error Messages -->
                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="fas fa-check-circle"></i> <span th:text="${successMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="fas fa-exclamation-circle"></i> <span th:text="${errorMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- General Configuration Section -->
                <div class="card section-card">
                    <div class="card-header section-header">
                        <h5 class="mb-0"><i class="fas fa-info-circle"></i> Información General</h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/admin/system-configuration/update}" th:object="${configuration}" method="post">
                            <input type="hidden" th:field="*{id}">
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="restaurantName" class="form-label">Nombre del Restaurante *</label>
                                    <input type="text" class="form-control" id="restaurantName" th:field="*{restaurantName}" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('restaurantName')}" th:errors="*{restaurantName}"></div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="slogan" class="form-label">Slogan</label>
                                    <input type="text" class="form-control" id="slogan" th:field="*{slogan}">
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="email" class="form-label">Correo Electrónico *</label>
                                    <input type="email" class="form-control" id="email" th:field="*{email}" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="phone" class="form-label">Teléfono *</label>
                                    <input type="text" class="form-control" id="phone" th:field="*{phone}" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="address" class="form-label">Dirección *</label>
                                <textarea class="form-control" id="address" th:field="*{address}" rows="2" required></textarea>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="logoUrl" class="form-label">Logo URL</label>
                                    <input type="url" class="form-control" id="logoUrl" th:field="*{logoUrl}" placeholder="https://ejemplo.com/logo.png">
                                    <small class="form-text text-muted">URL de la imagen del logo</small>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="taxRate" class="form-label">IVA (%) *</label>
                                    <input type="number" class="form-control" id="taxRate" th:field="*{taxRate}" step="0.01" min="0" max="100" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('taxRate')}" th:errors="*{taxRate}"></div>
                                </div>
                            </div>

                            <!-- Work Days -->
                            <div class="mb-3">
                                <label class="form-label">Días Laborales *</label>
                                <div class="row">
                                    <div class="col-md-12">
                                        <div th:each="day : ${allDays}" class="form-check form-check-inline day-checkbox">
                                            <input class="form-check-input" type="checkbox" 
                                                   th:id="'day_' + ${day}" 
                                                   name="workDays" 
                                                   th:value="${day}"
                                                   th:checked="${configuration.workDays.contains(day)}">
                                            <label class="form-check-label" th:for="'day_' + ${day}" th:text="${day.displayName}"></label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Payment Methods -->
                            <div class="mb-3">
                                <label class="form-label">Métodos de Pago</label>
                                <div class="row">
                                    <div class="col-md-4">
                                        <div class="form-check form-switch">
                                            <input class="form-check-input" type="checkbox" 
                                                   id="paymentCash" 
                                                   name="paymentCash"
                                                   th:checked="${configuration.paymentMethods.get(T(com.aatechsolutions.elgransazon.domain.entity.PaymentMethodType).CASH)}">
                                            <label class="form-check-label" for="paymentCash">
                                                <i class="fas fa-money-bill"></i> Efectivo
                                            </label>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-check form-switch">
                                            <input class="form-check-input" type="checkbox" 
                                                   id="paymentCreditCard" 
                                                   name="paymentCreditCard"
                                                   th:checked="${configuration.paymentMethods.get(T(com.aatechsolutions.elgransazon.domain.entity.PaymentMethodType).CREDIT_CARD)}">
                                            <label class="form-check-label" for="paymentCreditCard">
                                                <i class="fas fa-credit-card"></i> Tarjeta de Crédito
                                            </label>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-check form-switch">
                                            <input class="form-check-input" type="checkbox" 
                                                   id="paymentDebitCard" 
                                                   name="paymentDebitCard"
                                                   th:checked="${configuration.paymentMethods.get(T(com.aatechsolutions.elgransazon.domain.entity.PaymentMethodType).DEBIT_CARD)}">
                                            <label class="form-check-label" for="paymentDebitCard">
                                                <i class="fas fa-credit-card"></i> Tarjeta de Débito
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="text-end">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save"></i> Guardar Configuración General
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Business Hours Section -->
                <div class="card section-card">
                    <div class="card-header section-header">
                        <h5 class="mb-0"><i class="fas fa-clock"></i> Horarios de Atención</h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/admin/system-configuration/business-hours/update}" method="post">
                            <div class="table-responsive">
                                <table class="table table-bordered business-hours-table">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Día</th>
                                            <th>Hora Apertura</th>
                                            <th>Hora Cierre</th>
                                            <th>Cerrado</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="day : ${configuration.sortedWorkDays}">
                                            <td><strong th:text="${day.displayName}"></strong></td>
                                            <td>
                                                <input type="time" class="form-control" 
                                                       th:name="'openTime_' + ${day}"
                                                       th:value="${businessHoursMap.get(day)?.openTime}"
                                                       th:required="${businessHoursMap.get(day) != null && !businessHoursMap.get(day).isClosed}">
                                            </td>
                                            <td>
                                                <input type="time" class="form-control" 
                                                       th:name="'closeTime_' + ${day}"
                                                       th:value="${businessHoursMap.get(day)?.closeTime}"
                                                       th:required="${businessHoursMap.get(day) != null && !businessHoursMap.get(day).isClosed}">
                                            </td>
                                            <td class="text-center">
                                                <div class="form-check form-switch">
                                                    <input class="form-check-input" type="checkbox" 
                                                           th:name="'isClosed_' + ${day}"
                                                           th:checked="${businessHoursMap.get(day)?.isClosed}">
                                                </div>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            <div class="text-end">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save"></i> Guardar Horarios
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Social Networks Section -->
                <div class="card section-card">
                    <div class="card-header section-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="fas fa-share-alt"></i> Redes Sociales</h5>
                        <a th:href="@{/admin/system-configuration/social-networks/new}" class="btn btn-sm btn-success">
                            <i class="fas fa-plus"></i> Agregar Red Social
                        </a>
                    </div>
                    <div class="card-body">
                        <div th:if="${socialNetworks.isEmpty()}" class="alert alert-info">
                            <i class="fas fa-info-circle"></i> No hay redes sociales configuradas.
                        </div>
                        <div th:unless="${socialNetworks.isEmpty()}" class="table-responsive">
                            <table class="table table-hover">
                                <thead class="table-light">
                                    <tr>
                                        <th>Nombre</th>
                                        <th>URL</th>
                                        <th>Orden</th>
                                        <th>Estado</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="network : ${socialNetworks}">
                                        <td>
                                            <i th:if="${network.icon}" th:class="${network.icon}"></i>
                                            <span th:text="${network.name}"></span>
                                        </td>
                                        <td>
                                            <a th:href="${network.url}" target="_blank" class="text-decoration-none">
                                                <span th:text="${network.url}"></span>
                                                <i class="fas fa-external-link-alt fa-xs"></i>
                                            </a>
                                        </td>
                                        <td><span th:text="${network.displayOrder}"></span></td>
                                        <td>
                                            <span th:if="${network.active}" class="badge bg-success">Activo</span>
                                            <span th:unless="${network.active}" class="badge bg-secondary">Inactivo</span>
                                        </td>
                                        <td>
                                            <div class="btn-group" role="group">
                                                <a th:href="@{/admin/system-configuration/social-networks/{id}/edit(id=${network.id})}" 
                                                   class="btn btn-sm btn-outline-primary" title="Editar">
                                                    <i class="fas fa-edit"></i>
                                                </a>
                                                <form th:action="@{/admin/system-configuration/social-networks/{id}/toggle(id=${network.id})}" 
                                                      method="post" style="display:inline;">
                                                    <button type="submit" class="btn btn-sm btn-outline-warning" 
                                                            th:title="${network.active ? 'Desactivar' : 'Activar'}">
                                                        <i th:class="${network.active ? 'fas fa-toggle-on' : 'fas fa-toggle-off'}"></i>
                                                    </button>
                                                </form>
                                                <form th:action="@{/admin/system-configuration/social-networks/{id}/delete(id=${network.id})}" 
                                                      method="post" style="display:inline;" 
                                                      onsubmit="return confirm('¿Está seguro de eliminar esta red social?');">
                                                    <button type="submit" class="btn btn-sm btn-outline-danger" title="Eliminar">
                                                        <i class="fas fa-trash"></i>
                                                    </button>
                                                </form>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
