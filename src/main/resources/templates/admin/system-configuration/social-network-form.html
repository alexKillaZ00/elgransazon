<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit ? 'Editar Red Social' : 'Nueva Red Social'}">Red Social - El Gran Sazón</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h4 class="mb-0">
                            <i class="fas fa-share-alt"></i>
                            <span th:text="${isEdit ? 'Editar Red Social' : 'Nueva Red Social'}"></span>
                        </h4>
                    </div>
                    <div class="card-body">
                        <!-- Error Messages -->
                        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                            <i class="fas fa-exclamation-circle"></i> <span th:text="${errorMessage}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <form th:action="${isEdit ? '/admin/system-configuration/social-networks/' + socialNetwork.id + '/update' : '/admin/system-configuration/social-networks/create'}" 
                              th:object="${socialNetwork}" 
                              method="post">
                            
                            <input type="hidden" th:field="*{id}" th:if="${isEdit}">

                            <div class="mb-3">
                                <label for="name" class="form-label">Nombre *</label>
                                <input type="text" 
                                       class="form-control" 
                                       id="name" 
                                       th:field="*{name}" 
                                       th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                                       placeholder="Ej: Facebook, Instagram, Twitter"
                                       required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                            </div>

                            <div class="mb-3">
                                <label for="url" class="form-label">URL *</label>
                                <input type="url" 
                                       class="form-control" 
                                       id="url" 
                                       th:field="*{url}" 
                                       th:classappend="${#fields.hasErrors('url')} ? 'is-invalid' : ''"
                                       placeholder="https://facebook.com/tupagina"
                                       required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('url')}" th:errors="*{url}"></div>
                                <small class="form-text text-muted">Debe comenzar con http:// o https://</small>
                            </div>

                            <div class="mb-3">
                                <label for="icon" class="form-label">Icono (Clase CSS)</label>
                                <input type="text" 
                                       class="form-control" 
                                       id="icon" 
                                       th:field="*{icon}" 
                                       placeholder="Ej: fab fa-facebook, fab fa-instagram">
                                <small class="form-text text-muted">
                                    Clase de Font Awesome. 
                                    <a href="https://fontawesome.com/icons" target="_blank">Ver iconos disponibles</a>
                                </small>
                            </div>

                            <div class="mb-3">
                                <label for="displayOrder" class="form-label">Orden de Visualización</label>
                                <input type="number" 
                                       class="form-control" 
                                       id="displayOrder" 
                                       th:field="*{displayOrder}" 
                                       min="1"
                                       placeholder="1">
                                <small class="form-text text-muted">Número que determina el orden de visualización</small>
                            </div>

                            <div class="mb-3">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" 
                                           type="checkbox" 
                                           id="active" 
                                           th:field="*{active}">
                                    <label class="form-check-label" for="active">Activo</label>
                                </div>
                            </div>

                            <div class="d-flex justify-content-between">
                                <a th:href="@{/admin/system-configuration}" class="btn btn-secondary">
                                    <i class="fas fa-times"></i> Cancelar
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save"></i>
                                    <span th:text="${isEdit ? 'Actualizar' : 'Guardar'}"></span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Preview Section -->
                <div class="card mt-3" th:if="${socialNetwork.icon != null && !socialNetwork.icon.isEmpty()}">
                    <div class="card-body">
                        <h6>Vista Previa del Icono:</h6>
                        <i th:class="${socialNetwork.icon}" style="font-size: 2rem;"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Preview icon
        document.getElementById('icon').addEventListener('input', function(e) {
            const iconValue = e.target.value;
            const preview = document.querySelector('.card.mt-3 i');
            if (preview) {
                preview.className = iconValue;
            }
        });
    </script>
</body>
</html>
