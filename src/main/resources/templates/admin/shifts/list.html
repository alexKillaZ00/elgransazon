<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El Gran Sazón - Turnos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#38e07b",
                        "primary-dark": "#2bc866",
                    },
                },
            },
        };
    </script>
</head>
<body>
    <div class="relative flex min-h-screen flex-col bg-white" style='font-family: "Work Sans", sans-serif;'>
        <div class="flex flex-1 justify-center py-5">
            <div class="flex flex-col max-w-[1200px] flex-1 px-4">
                <!-- Header -->
                <div class="flex items-center justify-between pb-3 pt-6">
                    <h1 class="text-3xl font-bold text-gray-900">Gestión de Turnos</h1>
                    <a th:href="@{/admin/shifts/new}" class="px-4 py-2 bg-primary hover:bg-primary-dark text-white rounded-lg font-medium transition">
                        + Nuevo Turno
                    </a>
                </div>

                <!-- Alerts -->
                <div th:if="${successMessage}" class="mb-4 p-4 bg-green-50 border border-green-200 rounded-lg">
                    <p class="text-green-800" th:text="${successMessage}"></p>
                </div>

                <div th:if="${errorMessage}" class="mb-4 p-4 bg-red-50 border border-red-200 rounded-lg">
                    <p class="text-red-800" th:text="${errorMessage}"></p>
                </div>

                <!-- Stats -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                    <div class="bg-primary rounded-xl p-6">
                        <div class="text-white">
                            <p class="text-sm opacity-80">Turnos Activos</p>
                            <p class="text-4xl font-bold mt-2" th:text="${activeCount}">0</p>
                        </div>
                    </div>
                    <div class="bg-blue-500 rounded-xl p-6">
                        <div class="text-white">
                            <p class="text-sm opacity-80">Total de Turnos</p>
                            <p class="text-4xl font-bold mt-2" th:text="${totalCount}">0</p>
                        </div>
                    </div>
                </div>

                <!-- Empty State -->
                <div th:if="${shifts.isEmpty()}" class="text-center py-12 bg-gray-50 rounded-lg">
                    <p class="text-gray-600 mb-4">No hay turnos registrados</p>
                    <a th:href="@{/admin/shifts/new}" class="px-4 py-2 bg-primary hover:bg-primary-dark text-white rounded-lg inline-block">
                        Crear primer turno
                    </a>
                </div>

                <!-- Shifts Table -->
                <div th:if="${!shifts.isEmpty()}" class="bg-white rounded-lg border border-gray-200 overflow-hidden">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Nombre</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Horario</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Días</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Empleados</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Estado</th>
                                <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">Acciones</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200">
                            <tr th:each="shift : ${shifts}" class="hover:bg-gray-50">
                                <td class="px-6 py-4">
                                    <div class="font-medium text-gray-900" th:text="${shift.name}"></div>
                                    <div class="text-sm text-gray-500" th:text="${shift.description}"></div>
                                </td>
                                <td class="px-6 py-4 text-sm text-gray-900" th:text="${shift.timeRange}"></td>
                                <td class="px-6 py-4">
                                    <div class="flex flex-wrap gap-1">
                                        <span th:each="day : ${shift.workDays}" 
                                              class="px-2 py-1 text-xs bg-gray-100 text-gray-700 rounded"
                                              th:text="${day.getDisplayName()}">
                                        </span>
                                    </div>
                                </td>
                                <td class="px-6 py-4">
                                    <span class="px-2 py-1 text-xs bg-blue-100 text-blue-800 rounded" th:text="${shift.getEmployeeCount() + ' empleados'}"></span>
                                </td>
                                <td class="px-6 py-4">
                                    <span th:if="${shift.active}" class="px-2 py-1 text-xs bg-green-100 text-green-800 rounded">Activo</span>
                                    <span th:if="${!shift.active}" class="px-2 py-1 text-xs bg-gray-100 text-gray-800 rounded">Inactivo</span>
                                </td>
                                <td class="px-6 py-4 text-right space-x-2">
                                    <a th:href="@{/admin/shifts/{id}(id=${shift.id})}" class="text-blue-600 hover:text-blue-800">Ver</a>
                                    <a th:href="@{/admin/shifts/{id}/edit(id=${shift.id})}" class="text-yellow-600 hover:text-yellow-800">Editar</a>
                                    <a th:href="@{/admin/shifts/{id}/assign(id=${shift.id})}" class="text-primary hover:text-primary-dark">Asignar</a>
                                    <form th:action="@{/admin/shifts/{id}/delete(id=${shift.id})}" method="post" class="inline" th:if="${!shift.hasEmployees()}">
                                        <button type="submit" class="text-red-600 hover:text-red-800" onclick="return confirm('¿Eliminar este turno?')">Eliminar</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Back Button -->
                <div class="mt-6">
                    <a href="/admin/dashboard" class="text-gray-600 hover:text-gray-800">← Volver al Dashboard</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
